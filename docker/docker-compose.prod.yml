# ============================================================
# WingConcept — Docker Compose PRODUCCIÓN
# Override de docker-compose.yml — NO usar este archivo solo.
#
# Uso (desde la raíz del repo):
#   docker compose --env-file backend/.env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.prod.yml up -d --build
#
# O: bash docker/update.sh
# ============================================================

services:

  backend:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --proxy-headers
      --forwarded-allow-ips=*
    volumes: !reset []  # Sin montar código fuente en producción
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LOG_LEVEL=WARNING
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REQUIRE_EMAIL_VERIFIED=true
      - RUN_MIGRATIONS=false
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=3
      - DB_POOL_TIMEOUT=20
      - DB_COMMAND_TIMEOUT=25
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports: []  # No exponer Redis al exterior en producción
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]

  nginx:
    restart: always

  frontend:
    volumes: []
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
